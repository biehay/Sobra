<!doctype html>
<html lang="es">
  <body style="margin:0;background:#fafaf9;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fafaf9;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e7e5e4;border-radius:12px">
            <tr>
              <td style="padding:28px 32px 8px;font-size:22px;font-weight:800;color:#1c1917">Sobr<span style="color:#c2410c">á</span></td>
            </tr>
            <tr>
              <td style="padding:8px 32px 32px">
                <h1 style="margin:0 0 16px;font-size:20px;color:#1c1917">Tu código para confirmar la cuenta</h1>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.55;color:#44403c">
                  Escribí este código en la página de Sobrá para activar tu cuenta:
                </p>
                <p style="margin:0 0 20px;padding:16px;background:#fff1e8;border-radius:8px;text-align:center;font-family:'Courier New',monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#9a3412">
                  {{ .Token }}
                </p>
                <p style="margin:0;font-size:13px;line-height:1.5;color:#78716c">
                  El código vence en 1 hora. Si no creaste una cuenta en Sobrá, ignorá este email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
